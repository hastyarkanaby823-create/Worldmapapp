name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.7'

    - run: |
        mkdir -p app/src/main/java/com/worldmap/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        cat > settings.gradle <<'EOF'
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositories { google(); mavenCentral() } }
        rootProject.name='WorldMap'
        include ':app'
        EOF

        cat > build.gradle <<'EOF'
        plugins {
          id 'com.android.application' version '8.5.2' apply false
        }
        EOF

        cat > app/build.gradle <<'EOF'
        plugins { id 'com.android.application' }
        android {
          namespace 'com.worldmap.app'
          compileSdk 35
          defaultConfig {
            applicationId 'com.worldmap.app'
            minSdk 23
            targetSdk 35
            versionCode 1
            versionName '1.0'
          }
        }
        EOF

        cat > app/src/main/res/values/styles.xml <<'EOF'
        <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>
        </resources>
        EOF

        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
          <application android:theme="@style/AppTheme" android:label="World Map">
            <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
              <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>
            </activity>
          </application>
        </manifest>
        EOF

        cat > app/src/main/java/com/worldmap/app/MainActivity.java <<'EOF'
        package com.worldmap.app;
        import android.app.*;
        import android.os.*;
        import android.Manifest;
        import android.webkit.*;
        public class MainActivity extends Activity {
          public void onCreate(Bundle b) {
            super.onCreate(b);
            WebView w=new WebView(this);
            setContentView(w);
            w.getSettings().setJavaScriptEnabled(true);
            w.getSettings().setDomStorageEnabled(true);
            w.getSettings().setGeolocationEnabled(true);
            w.setWebViewClient(new WebViewClient());
            w.setWebChromeClient(new WebChromeClient(){
              public void onGeolocationPermissionsShowPrompt(String o,GeolocationPermissions.Callback c){
                c.invoke(o,true,false);
              }
            });
            if(Build.VERSION.SDK_INT>=23) requestPermissions(new String[]{
              Manifest.permission.ACCESS_FINE_LOCATION,
              Manifest.permission.ACCESS_COARSE_LOCATION},10);
            w.loadUrl("file:///android_asset/index.html");
          }
        }
        EOF

        cat > app/src/main/assets/index.html <<'EOF'
        <!doctype html>
        <html>
        <head>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
        html,body,#map{height:100%;margin:0}
        #bar{position:absolute;z-index:9;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
        input,button{padding:9px;border-radius:8px;border:1px solid #777}
        input{flex:1}
        </style>
        </head>
        <body>
        <div id="bar">
        <input id="q" placeholder="City or country">
        <button onclick="search()">🔎</button>
        <button onclick="loc()">📍</button>
        <button onclick="sat()">🛰️</button>
        <button onclick="clearM()">🗑️</button>
        </div>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
        let map=L.map('map').setView([20,0],2),ms=[];
        let st=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
        let sa=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
        map.on('click',e=>{let m=L.marker(e.latlng).addTo(map);m.bindPopup(e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)).openPopup();ms.push(m)});
        function clearM(){ms.forEach(x=>map.removeLayer(x));ms=[]}
        function sat(){map.removeLayer(st);map.addLayer(sa)}
        function loc(){navigator.geolocation.getCurrentPosition(p=>{map.setView([p.coords.latitude,p.coords.longitude],15);let m=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup('📍 My Location').openPopup();ms.push(m)})}
        function search(){let q=document.getElementById('q').value;if(!q)return;fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)).then(r=>r.json()).then(d=>{if(!d.length)return alert('Not found');let m=L.marker([d[0].lat,d[0].lon]).addTo(map).bindPopup(d[0].display_name).openPopup();map.setView([d[0].lat,d[0].lon],12);ms.push(m)})}
        </script>
        </body>
        </html>
        EOF

    - run: gradle assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: WorldMap-APK
        path: app/build/outputs/apk/debug/app-debug.apk
